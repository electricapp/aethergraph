[project]
name = "aethergraph"
version = "0.1.0"
description = "High-performance graph sampling for GNN training with Ray Data integration"
authors = [{name = "electricapp"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT OR Apache-2.0"}
keywords = ["graph", "gnn", "deep-learning", "ray", "pytorch", "graph-neural-networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.2.6",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
torch = ["torch>=2.13.0"]
ray = ["ray[data]>=2.58.0"]
pytorch-geometric = ["torch-geometric>=2.8.0.post1", "torch>=2.13.0"]
otel = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
]
all = ["torch>=2.13.0", "ray[data]>=2.58.0", "torch-geometric>=2.8.0.post1"]

[project.scripts]
aethergraph = "aethergraph.cli:main"

[project.urls]
Homepage = "https://github.com/electricapp/aethergraph"
Repository = "https://github.com/electricapp/aethergraph"
Documentation = "https://github.com/electricapp/aethergraph#readme"

[build-system]
requires = ["maturin>=1.14.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Forward through our crate's `extension-module` feature rather than pyo3's
# directly; that keeps `cargo test` able to link libpython (so unit tests
# run) while wheel builds still skip libpython linking.
features = ["extension-module"]
python-source = "."
module-name = "aethergraph._core"
manifest-path = "../crates/aethergraph-py/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    # Everything not explicitly waived below is an error.
    "error",
    # Upstream issues - cannot fix from our code:
    # PyG imports deprecated torch_geometric.distributed internally
    "ignore:.*torch_geometric.distributed.*:DeprecationWarning",
    # PyG calls deprecated torch.jit.script at import
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
    # Ray DataContext uses deprecated config names internally
    "ignore:.*use_push_based_shuffle.*:DeprecationWarning",
    "ignore:.*use_polars.*:DeprecationWarning",
    "ignore:.*use_arrow_tensor_v2.*:DeprecationWarning",
    # ray.shutdown() leaves worker Popen handles to be GC'd at interpreter exit
    "ignore:Exception ignored in. .function Popen.__del__:pytest.PytestUnraisableExceptionWarning",
    # ray's process-kill path leaks its own log-file handles
    "ignore:unclosed file:ResourceWarning:ray._private",
    "ignore:Exception ignored in. ._io.FileIO:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# typer's API is call-in-default by design
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# benchmark harness keeps going when a competitor library blows up
"benchmarks/*" = ["BLE001"]

[tool.mypy]
# 3.12 floor: numpy 2.x stubs use PEP 695 `type` statements, which mypy
# rejects when analyzing for older versions.
python_version = "3.12"
# Strict lives in the config, not in the command line, so `mypy aethergraph`
# and `mypy aethergraph --strict` cannot disagree about what passing means.
strict = true
warn_unused_configs = true
namespace_packages = true

# Gaps in torch's and ray's own stubs are waived at the call site with a
# narrow `type: ignore[code]`, never by excluding a module here: an exclusion
# would also wave through the next untyped call anywhere in that tree.
# `strict` implies `warn_unused_ignores`, so each waiver fails the run once
# upstream annotates it and can be deleted.

# Third-party libraries that don't ship `py.typed` markers / stubs. We treat
# their public surface as `Any` rather than fail the strict run.
[[tool.mypy.overrides]]
module = [
    "torch_geometric.*",
    "pydantic",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "hypothesis>=6.165.9",
    "maturin>=1.14.0",
    "mypy>=2.3.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
test = [
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
    "ray[data]>=2.58.0",
]
