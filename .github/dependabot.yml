version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    commit-message:
      prefix: "deps(rust)"
    labels: ["dependencies", "rust"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]

  # Python packaging — build-system + dev/test requirements under /python.
  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    commit-message:
      prefix: "deps(python)"
    labels: ["dependencies", "python"]
    groups:
      python:
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]

  # GitHub Actions workflows — Dependabot bumps both the SHA pin and
  # the trailing version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    commit-message:
      prefix: "deps(actions)"
    labels: ["dependencies", "actions"]
    groups:
      actions:
        patterns: ["*"]
