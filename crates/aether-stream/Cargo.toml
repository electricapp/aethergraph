[package]
name = "aether-stream"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kernel-bypass streaming engine: AF_XDP ingestion, seqlock feature table, RDMA one-sided reads"

[lints]
workspace = true

[lib]
bench = false

[features]
default = []
rdma = ["aether-mem/rdma"]
mlx5dv = ["rdma"]
cuda = ["aether-mem/cuda"]
gpudirect = ["rdma", "cuda", "dep:cudarc"]
# GDRCopy BAR1 small-write path. Links NVIDIA's libgdrapi (needs the
# gdrdrv kernel module at runtime); build with `gpudirect gdrcopy`.
gdrcopy = ["gpudirect"]
# EFA SRD path — skeleton only; see crates/aether-stream/src/rdma/srd.rs for
# the work needed before this is functional. Building with this feature today
# only exposes the type stubs; no link to libefa yet.
efa = ["rdma"]
# Load + attach an XDP redirect program so AF_XDP `bind` works on veth.
# Needed for the T1.8 end-to-end UDP → FeatureTable test. The BPF program
# is compiled by `build.rs` via `clang --target=bpf`; users without that
# toolchain should just leave the feature off.
xdp_bpf = ["dep:aya"]
# K4.1 sched_ext BPF object compile path (clang --target=bpf). Loader is
# userspace; the .bpf.o is produced by build.rs when this feature is on.
sched_ext_bpf = []

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "feature_table_bench"
harness = false

[[bench]]
name = "kernels"
path = "benches/kernels/main.rs"
harness = false
required-features = ["gpudirect"]

[[test]]
name = "kernels"
path = "tests/kernels/main.rs"
required-features = ["gpudirect"]

[target.'cfg(target_os = "linux")'.dependencies]
aethergraph-core  = { path = "../aethergraph-core", version = "0.1" }
aether-mem        = { path = "../aether-mem", version = "0.1", features = ["parallel-prefault", "tracing"] }
libc              = "0.2"
core_affinity     = "0.8"
tracing           = "0.1"
crossbeam-channel = "0.5"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
cudarc            = { version = "0.19", features = ["cuda-12050"], optional = true }
aya               = { version = "0.14", optional = true }
