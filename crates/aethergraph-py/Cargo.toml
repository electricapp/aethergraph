[package]
name = "aethergraph-py"
version = "0.1.0"
edition = "2024"
authors = ["electricapp"]
license = "MIT OR Apache-2.0"
description = "Python bindings for AetherGraph high-performance graph sampling"

[lints]
workspace = true

[features]
# extension-module tells pyo3 not to link against libpython (the Python
# interpreter loads this crate as a dylib). Wheel builds go through maturin
# which turns this on via `[tool.maturin].features` in python/pyproject.toml.
# Plain `cargo test` omits it so unit tests can link against libpython
# normally and run as a standalone test binary.
#
# `uffd` and `shm` are on by default: both are additionally Linux-gated, so
# mac builds are unaffected. On Linux `FeatureStore.load_paged` raises when
# the kernel withholds userfaultfd rather than failing the build, and
# `SharedFeatureStore` is simply absent off Linux (check the module's
# HAS_SHARED_STORE flag).
#
# `abi3` is on by default too: the shipped wheel targets the stable ABI
# (CPython 3.10+), one wheel for every interpreter. It is a feature rather
# than a hardcoded pyo3 flag so the free-threaded (cp314t) wheel can turn
# it off — the free-threaded ABI is not part of abi3, and pyo3 rejects
# `abi3` + a free-threaded interpreter. Build that variant with
# `--no-default-features --features "extension-module uffd shm"`.
default = ["abi3", "uffd", "shm"]
abi3 = ["pyo3/abi3-py38"]
extension-module = ["pyo3/extension-module"]
gpudirect = ["aether-stream/gpudirect"]
uffd = ["aethergraph-core/uffd"]
shm = ["aethergraph-core/shm"]

[lib]
name = "_core"
crate-type = ["cdylib"]
# `test = false` is NOT set here — we want plain `cargo test -p aethergraph-py`
# to pick up the unit tests. Maturin turns on `pyo3/extension-module` via
# pyproject.toml's `[tool.maturin]` when building wheels, which skips libpython
# linking; plain cargo test omits that flag and links libpython normally so
# tests run as a standalone binary.
doctest = false
bench = false

[dependencies]
# `numa` and `nvme-passthru` are always requested: both are additionally
# gated on Linux, so mac and one-socket Linux wheels are unaffected. On a
# multi-socket box the placement calls interleave the graph body and pin the
# sampler pool; on a Linux wheel the store probes /dev/ng* at open and
# silently falls back to the O_DIRECT io_uring gather when passthrough is
# unavailable. `zstd-tier` is portable, so the compressed backing tier ships
# on every wheel; it stays inert unless a `cold_store_path` is configured.
aethergraph-core = { path = "../aethergraph-core", version = "0.1", features = [
    "numa",
    "nvme-passthru",
    "zstd-tier",
] }
# `wal` is always on so the Python `DynamicGraph.open_with_wal` constructor is
# present on every wheel build — durability is a runtime opt-in (pass a path or
# don't), not a compile-time one. `io-uring` rides along: its dependency is
# Linux-target-gated, so Linux wheels get the linked-SQE group commit (with a
# runtime fallback) while mac builds compile the portable path only.
aether-graph = { path = "../aether-graph", version = "0.1", features = ["wal", "io-uring"] }

# PyO3 for Python bindings. `extension-module` and `abi3-py38` are both
# enabled via this crate's own features (above) — abi3 through the default
# `abi3` feature, extension-module through maturin — so `cargo test` links
# libpython normally and the free-threaded wheel can drop abi3.
pyo3 = { version = "0.29", features = [] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# Apache Arrow for zero-copy data transfer
arrow-array = "59"
arrow-schema = "59"

# Numpy integration
numpy = "0.29"

# Error handling
anyhow = "1.0"

# Rust-side global allocator: the batch loop is allocation-heavy and
# mimalloc's thread-local heaps outperform system malloc on that churn.
# Pinned to the v2 series: v3's arena reclaim (_mi_arenas_page_unabandon)
# can yield-spin forever when the main thread frees buffers allocated by
# an already-exited sampler thread — the loader pool does exactly that on
# every shutdown. v2's segment abandonment has no such wait loop.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

# Other utilities
parking_lot = "0.12"

[dependencies.aether-stream]
path = "../aether-stream"
version = "0.1"
optional = true
