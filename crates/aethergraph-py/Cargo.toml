[package]
name = "aethergraph-py"
version = "0.1.0"
edition = "2024"
authors = ["electricapp"]
license = "MIT OR Apache-2.0"
description = "Python bindings for AetherGraph high-performance graph sampling"

[lints]
workspace = true

[features]
# extension-module tells pyo3 not to link against libpython (the Python
# interpreter loads this crate as a dylib). Wheel builds go through maturin
# which turns this on via `[tool.maturin].features` in python/pyproject.toml.
# Plain `cargo test` omits it so unit tests can link against libpython
# normally and run as a standalone test binary.
default = []
extension-module = ["pyo3/extension-module"]
gpudirect = ["aether-stream/gpudirect"]

[lib]
name = "_core"
crate-type = ["cdylib"]
# `test = false` is NOT set here — we want plain `cargo test -p aethergraph-py`
# to pick up the unit tests. Maturin turns on `pyo3/extension-module` via
# pyproject.toml's `[tool.maturin]` when building wheels, which skips libpython
# linking; plain cargo test omits that flag and links libpython normally so
# tests run as a standalone binary.
doctest = false
bench = false

[dependencies]
aethergraph-core = { path = "../aethergraph-core", version = "0.1" }
# `wal` is always on so the Python `DynamicGraph.open_with_wal` constructor is
# present on every wheel build — durability is a runtime opt-in (pass a path or
# don't), not a compile-time one.
aether-graph = { path = "../aether-graph", version = "0.1", features = ["wal"] }

# PyO3 for Python bindings. `extension-module` is conditionally enabled via
# this crate's `extension-module` feature (above) so `cargo test` links
# normally while `maturin build` still skips libpython linking.
pyo3 = { version = "0.29", features = ["abi3-py38"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# Apache Arrow for zero-copy data transfer
arrow-array = "59"
arrow-schema = "59"

# Numpy integration
numpy = "0.29"

# Error handling
anyhow = "1.0"

# Rust-side global allocator: the batch loop is allocation-heavy and
# mimalloc's thread-local heaps outperform system malloc on that churn.
# Pinned to the v2 series: v3's arena reclaim (_mi_arenas_page_unabandon)
# can yield-spin forever when the main thread frees buffers allocated by
# an already-exited sampler thread — the loader pool does exactly that on
# every shutdown. v2's segment abandonment has no such wait loop.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

# Other utilities
parking_lot = "0.12"

[dependencies.aether-stream]
path = "../aether-stream"
version = "0.1"
optional = true
