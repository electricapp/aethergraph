[package]
name = "aethergraph-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
bench = false

[features]
default = []
io-uring = []
gds = []
# zstd-compressed, dictionary-trained cold feature tier: rarely touched
# rows compressed in fixed-size blocks, decompressed per-block on gather.
zstd-tier = ["dep:zstd"]
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
# Enables loom-backed model checking of the lock-free union-find. Run with:
#   cargo test -p aethergraph-core --features loom --test loom_union_find
loom = []

[dependencies]
aether-epoch = { path = "../aether-epoch", version = "0.1" }
memmap2.workspace = true
bytemuck.workspace = true
rayon.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
rand.workspace = true
rustc-hash.workspace = true
crc32fast.workspace = true
ahash.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
tokio = { workspace = true, features = ["test-util"] }
ndarray.workspace = true
half.workspace = true
libc = "0.2"
parquet = { version = "59", optional = true, default-features = false, features = ["arrow"] }
arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
zstd = { version = "0.13", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"
io-uring = "0.7"

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
# Opt-in model checker for the lock-free union-find; only built under the
# `loom` feature (see the `loom_union_find` test target below).
loom = "0.7"

[[test]]
name = "loom_union_find"
path = "tests/loom_union_find.rs"
required-features = ["loom"]

[[bench]]
name = "graph_benchmarks"
harness = false

[[bench]]
name = "async_io_benchmark"
harness = false

[[bench]]
name = "sync_scalability"
harness = false

[[bench]]
name = "hetero_benchmarks"
harness = false
