[package]
name = "aether-mem"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lock-free slab allocator with HugePages and pluggable memory hooks"

[lints]
workspace = true

[lib]
bench = false

[features]
default = []
parallel-prefault = ["dep:rayon"]
tracing = ["dep:tracing"]
rdma = []
cuda = ["dep:cudarc"]

[dependencies]
libc    = "0.2"
rayon   = { version = "1.12", optional = true }
tracing = { version = "0.1", optional = true }
cudarc  = { version = "0.19", features = ["cuda-12050"], optional = true }

# Swaps the free-list atomics for loom's so the loom test exercises the real
# shipped code. Off unless the scoped loom run enables the cfg:
#   RUSTFLAGS="--cfg loom" cargo test -p aether-mem --test loom_lockfree --release
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest = "1"
