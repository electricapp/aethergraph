[package]
name = "aether-graph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lock-free dynamic graph with C-tree neighbor lists. Single-writer, multi-reader, zero-alloc reads."

[lints]
workspace = true

[lib]
bench = false

[dependencies]
aether-epoch = { path = "../aether-epoch", version = "0.1" }
tracing.workspace = true
rustc-hash.workspace = true
# Optional WAL durability — gated behind the `wal` feature so binaries that
# only want in-memory operation pay no compile / link cost for it.
crc32fast = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# Reserved virtual mappings for the embedding row store.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
criterion = "0.8"
rand = "0.10"
proptest = "1"
tempfile.workspace = true
# loom is opt-in: a separate `cargo test --features loom` run exercises the
# lock-free CAS paths under loom's interleaving model.
loom = "0.7"

[features]
default = []
# Enables loom-backed model checking of the writer-guard CAS and dirty bitmap.
# Build a separate binary in CI:
#   cargo test -p aether-graph --features loom --test loom_writer_guard
loom = []
# Enables the append-only write-ahead log + replay-based recovery. Off by
# default: callers who want crash durability opt in explicitly.
wal = ["dep:crc32fast"]
# Linux-only group-commit fast path: `WalWriter::sync` submits its write
# and fdatasync as one linked io_uring chain — one syscall instead of two,
# with ordering enforced in-kernel. Falls back to the portable path when
# ring setup fails at runtime.
io-uring = ["dep:io-uring"]

[[bench]]
name = "ctree_bench"
harness = false

[[test]]
name = "loom_writer_guard"
path = "tests/loom_writer_guard.rs"
required-features = ["loom"]

[[test]]
name = "loom_pin_reclaim"
path = "tests/loom_pin_reclaim.rs"
required-features = ["loom"]
