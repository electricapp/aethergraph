services:
  dev:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
      target: dev
    image: aethergraph-dev:latest
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-dir:/workspace/target
      - uv-cache:/root/.cache/uv
    environment:
      # Named volume, not bind mount — macOS osxfs is 5-10x slower for incremental builds.
      CARGO_TARGET_DIR: /workspace/target
    tty: true
    stdin_open: true

  dev-rdma:
    extends: dev
    build:
      target: dev-rdma
    image: aethergraph-dev-rdma:latest
    # Opt-in via `--profile rdma`. Won't work on Docker Desktop (no IB stack in the VM).
    profiles: ["rdma"]
    devices:
      - "/dev/infiniband:/dev/infiniband"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

volumes:
  cargo-registry:
  cargo-git:
  target-dir:
  uv-cache:
