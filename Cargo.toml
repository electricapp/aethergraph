[workspace]
members = [
    "crates/aethergraph-core",
    "crates/aethergraph-cli",
    "crates/aethergraph-py",
    "crates/aether-epoch",
    "crates/aether-mem",
    "crates/aether-stream",
    "crates/aether-graph",
]
exclude = [
    # cargo-fuzz crate; built separately with nightly toolchain.
    "fuzz",
]
default-members = [
    "crates/aethergraph-core",
    "crates/aethergraph-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["electricapp"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/electricapp/aethergraph"

[workspace.dependencies]
# Core dependencies
memmap2 = "0.9"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.12"

# Serialization
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }

# CLI
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.18"

# Logging - Structured logging for production
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Performance - HPC-grade optimizations
parking_lot = "0.12"
rand = "0.10"
rustc-hash = "2.1"  # Faster hashing than std HashMap
ahash = "0.8"       # Alternative fast hasher
crc32fast = "1.5"   # SIMD CRC32 with runtime dispatch (integrity checksums)

# SIMD
wide = "1.5"

# Lock-free channels for prefetching
crossbeam-channel = "0.5"

# Async I/O (for Phase 2)
tokio = { version = "1.52", features = ["full"] }
futures = "0.3"

# Numerical computing
ndarray = "0.17"
half = "2"

# Dev dependencies
tempfile = "3.27"
criterion = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
